name: MLOps CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qa-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          # Instala el resto de dependencias de tu proyecto (numpy, seldon-core, scipy, etc)
          pip install -e . 

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest
        run: pytest tests/