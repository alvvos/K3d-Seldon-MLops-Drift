apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seldon-model-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /api/v0.1/predictions
            pathType: Prefix
            backend:
              service:
                name: mlops-model-default
                port:
                  number: 8000