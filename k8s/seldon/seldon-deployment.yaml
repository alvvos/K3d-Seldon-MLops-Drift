apiVersion: machinelearning.seldon.io/v1
kind: SeldonDeployment
metadata:
  name: mlops-model
  namespace: default
  labels:
    app.kubernetes.io/name: credit-risk-classifier
    app.kubernetes.io/part-of: mlops-k8s-project
spec:
  name: model-deployment
  annotations:
    seldon.io/rest-read-timeout: "10000"
  predictors:
    - name: default
      replicas: 1
      graph:
        name: classifier
        type: MODEL
        endpoint:
          type: REST
      componentSpecs:
        - metadata:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "8000"
              prometheus.io/path: "/prometheus"
          spec:
            containers:
              - name: classifier
                image: alvarosalis/mlops-model:v2
                imagePullPolicy: IfNotPresent
                envFrom:
                  - configMapRef:
                      name: mlops-model-config
                resources:
                  requests:
                    cpu: "100m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
                readinessProbe:
                  httpGet:
                    path: /health/status
                    port: 9000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
                livenessProbe:
                  httpGet:
                    path: /health/ping
                    port: 9000
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
          hpaSpec:
            minReplicas: 1
            maxReplicas: 4
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  targetAverageUtilization: 50
