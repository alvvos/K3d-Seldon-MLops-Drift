apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seldon-model-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: credit-risk-classifier
    app.kubernetes.io/part-of: mlops-k8s-project
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      seldon-deployment-id: mlops-model
  endpoints:
    - port: http
      path: /prometheus
      interval: 15s
      scrapeTimeout: 10s
